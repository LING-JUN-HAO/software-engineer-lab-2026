<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="stylesheet" href="./static/reset.css" />
    <link rel="stylesheet" href="./static/base.css" />
    <link rel="stylesheet" href="./static/index.css" />
    <title>2026 軟體工程師體驗營 - 主線任務 4</title>
  </head>
  <body>
    <section class="projects bg-primary-50">
      <div class="container relative">
        <div class="d-flex gap-24 flex-md-col gap-md-0 mx-md--12">
          <div class="col-5 col-md-12">
            <img
              src="https://github.com/hexschool/2022-web-layout-training/blob/main/2026-web-camp/subscription.png?raw=true"
              alt=""
            />
          </div>
          <div class="col-7 col-md-12">
            <div
              class="text-neutral-0 px-40 py-md-40 px-md-12 h-full d-flex flex-col justify-content-center py-80 py-md-40"
            >
              <!-- 標題 -->
              <h2 class="mb-24 mb-md-12">
                <span class="d-block heading-xxxs heading-mobile-xxxxs"
                  >電子報訂閱</span
                >
                <span class="d-block heading-xxxl heading-mobile-xl"
                  >SUBSCRIPTION</span
                >
              </h2>
              <!-- 內文 -->
              <p class="paragraph-md mb-24 paragraph-mobile-sm">
                你也在追求設計美感與技術落地的完美平衡嗎？作為資深設計師兼工程師，我深知跨領域協作的痛點。訂閱電子報，我將分享如何利用
                AI 工具提升產能！
              </p>
              <!-- 輸入框 -->
              <div class="d-flex rounded-40 btn-outline p-8">
                <input
                  class="paragraph-md py-12 pl-24 text-neutral-0 bg-transparent border-0 focus-outline-0 flex-1 paragraph-mobile-sm"
                  type="text"
                  placeholder="電子信箱"
                />
                <button
                  type="button"
                  class="label-md btn-reset py-12 px-24 bg-neutral-0 rounded-full text-neutral-700 label-mobile-sm"
                >
                  送出
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
